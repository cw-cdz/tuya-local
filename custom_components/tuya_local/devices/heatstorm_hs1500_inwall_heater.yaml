name: Heater
products:
  - id: eb9c7d34db41a83854ev6a
    name: Heatstorm HS-1500 In-Wall
primary_entity:
  entity: climate
  translation_only_key: heater
  dps:
    - id: 101
      type: string
      name: hvac_mode
      mapping:
        - constraint: power
          conditions:
            - dps_val: false
              value: "off"
            - dps_val: true
              mapping:
                - dps_val: "Heat"
                  value: heat
                - dps_val: "Fan"
                  value: fan_only
    - id: 1
      type: boolean
      name: power
      hidden: true
    - id: 2
      type: integer
      name: temperature
      optional: true
      range:
        min: 4
        max: 37
      mapping:
        - constraint: temperature_unit
          conditions:
            - dps_val: f
              value_redirect: set_temp_f
              range:
                min: 40
                max: 99
    - id: 3
      type: integer
      name: current_temperature
      optional: true
      mapping:
        - constraint: temperature_unit
          conditions:
            - dps_val: f
              value_redirect: cur_temp_f
    - id: 4
      type: string
      name: preset_mode
      mapping:
        - dps_val: "Auto"
          value: comfort
        - dps_val: "Low"
          value: eco
        - dps_val: "High"
          value: boost
    - id: 5
      type: string
      name: fan_mode
      mapping:
        - dps_val: "Low"
          value: low
        - dps_val: "Auto"
          value: auto
        - dps_val: "High"
          value: high
    - id: 13
      type: string
      name: temperature_unit
      mapping:
        - dps_val: c
          value: C
        - dps_val: f
          value: F
    - id: 14
      type: integer
      name: set_temp_f
      range:
        min: 40
        max: 99
      hidden: true
    - id: 15
      type: integer
      name: cur_temp_f
      hidden: true

secondary_entities:
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
        mapping:
          - dps_val: true
            value: true
          - dps_val: false
            value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 21
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 21
        type: bitfield
        name: fault_code
      - id: 21
        type: bitfield
        name: description
        mapping:
          - dps_val: 1
            value: Temp sensor fault
          - dps_val: 2
            value: Tilt over
          - dps_val: 4
            value: Over-voltage
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: switch
    name: Beep
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: select
    name: Thermometer
    category: config
    dps:
      - id: 105
        type: string
        optional: true
        hidden: true
        name: option
        mapping:
          - dps_val: "Internal_thermometer"
            value: Internal
          - dps_val: "External_thermometer"
            value: External
